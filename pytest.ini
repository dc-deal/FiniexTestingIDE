[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --import-mode=importlib lets a single pytest invocation collect the whole tree. Without
# it, 14 test files sharing 5 basenames under tests/simulation/ collide on import and
# `pytest tests/` fails with 9 collection errors; §23 forbids the __init__.py route.
# Measured through the runner: 64 suites, 2977 passed, group totals unchanged.
addopts = -v --tb=short --import-mode=importlib

# =============================================================================
# Test Marks — pipeline domain classification
# Applied automatically by tests/conftest.py based on path.
# Do NOT add marks to individual test files.
# Every mark here is a PATH SYNONYM — it falls out of the tree and cannot go stale. A mark that
# would need a maintained list of directories does not belong here; that is how the former
# `unit` / `integration` pair came to be wrong and unused at the same time.
# =============================================================================
markers =
    simulation: Simulation (backtesting) pipeline tests
    autotrader: AutoTrader (live trading) pipeline tests
    parity: Dual-pipeline parity tests — simulation vs. AutoTrader identical output
    framework: Framework component tests (bars, workers, API, etc.)
    data: Data pipeline tests (import, parquet, tick reader)
    benchmark: Performance benchmark tests — excluded from normal runner
    live_adapter: Live broker adapter tests — require real account credentials, excluded from normal runner
    live_field_study: Real-money field study certificate validation — operator-driven, excluded from normal runner
    live_signal_feed: Live signal feed certificate — probes the production producer, excluded from normal runner

# =============================================================================
# Warning Filters
# =============================================================================
# FiniexTestingIDE uses ProcessPoolExecutor with fork() on Linux for true
# parallelism across scenarios (see docs/process_execution_guide.md).
#
# Python 3.12+ emits a DeprecationWarning when os.fork() is called in a
# multi-threaded process. This is expected behavior in our architecture:
# - Production: ProcessPool uses fork() for zero-copy CoW data sharing
# - Debug mode: Auto-switches to ThreadPool (no fork, no warning)
# - pytest runs: BatchOrchestrator initializes the pool → triggers fork()
#
# The warning originates from:
#   /usr/local/lib/python3.12/multiprocessing/popen_fork.py:66
#   "This process is multi-threaded, use of fork() may lead to deadlocks"
#
# We suppress this globally because:
# 1. fork() is a deliberate design choice (not accidental)
# 2. Our subprocesses create all objects fresh (no shared state → no deadlock)
# 3. The warning is noise in test output across ALL test suites
# =============================================================================
filterwarnings =
    ignore:This process.*is multi-threaded:DeprecationWarning